# Tag-driven release. A v* tag produces one archive per supported platform.
#
# macOS and Linux: the check reads the resolver configuration each system
# applies, and a binary built for a system this tool cannot read would refuse to
# run.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The job is named for what it does on each platform, because it runs there.
  # A job that needs itself is rejected when the workflow graph is built, so the
  # name must stay distinct from anything that depends on it.
  test-platform:
    name: test (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
          - os: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The binary is run on the system it was built for, because the check reads
      # that system's live resolver state and refuses to run anywhere else.
      - name: Vet, test and run
        run: |
          go vet ./...
          go test ./... -count=1
          make build VERSION="${GITHUB_REF_NAME}"
          reported=$(./dns-verify --version)
          want="dns-verify ${GITHUB_REF_NAME}"
          if [ "$reported" != "$want" ]; then
            echo "version is '$reported', want '$want'"
            exit 1
          fi
          # A run that cannot read this system exits 2, which would pass the
          # version check above and ship a binary that does nothing.
          if ! ./dns-verify > report.txt; then
            echo "the check did not complete on ${{ matrix.os }}"
            cat report.txt
            exit 1
          fi
          head -3 report.txt

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    needs: [ test-platform ]
    runs-on: ${{ matrix.os == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      # Cancelling the sibling on the first failure hides that architecture's
      # result, which is how a release once shipped with a missing binary.
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p staging
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o staging/dns-verify ./cmd/dns-verify
          archive="dns-verify_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar czf "$archive" -C staging dns-verify
          # A second copy without the version, so that the documented download
          # URL keeps working after the next release renames its own assets.
          cp "$archive" "dns-verify_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          # An archive holding the wrong file installs silently and fails at run
          # time, so the contents are checked before it ships.
          for a in "$archive" "dns-verify_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"; do
            contents=$(tar tzf "$a")
            if [ "$contents" != "dns-verify" ]; then
              echo "$a holds '$contents', want exactly 'dns-verify'"
              exit 1
            fi
          done
          # The binary must report this tag, so a stamping mistake fails here
          # rather than in a user's hands.
          reported=$(./staging/dns-verify --version)
          if [ "$reported" != "dns-verify ${GITHUB_REF_NAME}" ]; then
            echo "binary reports '$reported', want 'dns-verify ${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "built $archive"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dns-verify_${{ matrix.os }}_${{ matrix.arch }}
          path: dns-verify_*.tar.gz
          # A path that matches nothing leaves an empty artifact and the job
          # still passes, which is how a release once shipped with no binary.
          if-no-files-found: error

  publish:
    name: publish
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: List the archives
        run: ls -l archives

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: archives/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false